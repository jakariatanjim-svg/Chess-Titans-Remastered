name: "Windows — Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.4 or 2.0). Leave blank to continue automatically."
        required: false
        default: ""
        type: string
      confirm:
        description: "Allow publishing from a non-default branch"
        required: false
        default: false
        type: boolean

# Release version selection and tag creation must not race each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Windows release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check release branch
        env:
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "Publishing from default branch $GITHUB_REF_NAME"
          elif [ "$CONFIRMED" = "true" ]; then
            echo "::warning::Publishing from $GITHUB_REF_NAME; default branch is $DEFAULT_BRANCH."
          else
            echo "::error::$GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH). Re-run with the confirmation input enabled, or use Windows — Test Build."
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > /tmp/tags.txt
          python3 - /tmp/tags.txt "$GITHUB_OUTPUT" <<'PY'
          import os
          import re
          import subprocess
          import sys

          override = os.environ.get("VERSION_OVERRIDE", "").strip()
          existing_tags = set()
          highest = None
          with open(sys.argv[1], encoding="utf-8") as tags:
              for raw in tags:
                  tag = raw.strip()
                  if not tag:
                      continue
                  existing_tags.add(tag)
                  match = re.fullmatch(r"v?(\d+)\.(\d)", tag)
                  if match:
                      pair = (int(match.group(1)), int(match.group(2)))
                      if highest is None or pair > highest:
                          highest = pair

          def fail(message):
              print("::error::" + message)
              raise SystemExit(1)

          def next_version(pair):
              major, minor = pair
              return (major, minor + 1) if minor < 9 else (major + 1, 0)

          if override:
              match = re.fullmatch(r"v?(\d+)(?:\.(\d))?", override)
              if not match:
                  fail("Version override must look like 2, 1.4, or v1.4.")
              chosen = (int(match.group(1)), int(match.group(2) or 0))
              if highest is not None and chosen < highest:
                  baseline = next_version(highest)
                  print("::warning::Publishing v%d.%d below the highest tag v%d.%d. The next automatic release will continue at v%d.%d." % (chosen + highest + baseline))
          else:
              chosen = next_version(highest) if highest is not None else (1, 0)

          version = "%d.%d" % chosen
          tag = "v" + version
          if tag in existing_tags or version in existing_tags:
              fail("Tag %s already exists. Leave the override empty to choose the next version." % tag)
          if subprocess.run(["gh", "release", "view", tag], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              fail("Release %s already exists. Choose another version or leave the override blank." % tag)

          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write("version=%s\ntag=%s\n" % (version, tag))
          print("Release version: %s" % tag)
          PY

      - name: Set up Godot and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Build Windows package
        run: |
          set +e
          bash tools/build_windows.sh "${{ steps.version.outputs.version }}" 2>&1 | tee /tmp/windows-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            {
              echo "### Windows build diagnostics (last 60 lines)"
              echo '```text'
              tail -n 60 /tmp/windows-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("/tmp/windows-build.log").read_text(errors="replace").splitlines()[-30:]
          for line in lines:
              safe = line[:600].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Windows build diagnostics::" + safe)
          PY
            exit "$build_status"
          fi

      - name: Create tagged GitHub release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="build/Chess-Titans-Remastered-v${VERSION}-Windows-x64.zip"
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "Chess Titans Remastered — v$VERSION" \
            --generate-notes

      - name: Release summary
        if: always()
        run: |
          {
            echo "### Windows release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Version | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Release | [${{ steps.version.outputs.tag }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}) |"
            echo "| Notes | Generated automatically by GitHub |"
            echo "| Windows package | \`Chess-Titans-Remastered-v${{ steps.version.outputs.version }}-Windows-x64.zip\` |"
          } >> "$GITHUB_STEP_SUMMARY"
