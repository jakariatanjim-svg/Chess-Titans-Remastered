name: "Windows — Test Build"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  artifact:
    name: Windows x64 artifact (${{ github.ref_name }})
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version label
        id: version
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > /tmp/tags.txt
          python3 - /tmp/tags.txt "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys

          highest = None
          with open(sys.argv[1], encoding="utf-8") as tags:
              for raw in tags:
                  match = re.fullmatch(r"v?(\d+)\.(\d)", raw.strip())
                  if match:
                      pair = (int(match.group(1)), int(match.group(2)))
                      if highest is None or pair > highest:
                          highest = pair

          if highest is None:
              version = (1, 0)
          elif highest[1] < 9:
              version = (highest[0], highest[1] + 1)
          else:
              version = (highest[0] + 1, 0)

          value = "%d.%d" % version
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write("version=%s\n" % value)
          print("Artifact version label: v%s (not published)" % value)
          PY

      - name: Make a safe artifact label
        id: label
        run: |
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          {
            echo "ref=$SAFE_REF"
            echo "sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Godot and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Build Windows package
        run: bash tools/build_windows.sh "${{ steps.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-titans-windows-${{ steps.label.outputs.ref }}-${{ steps.label.outputs.sha }}-v${{ steps.version.outputs.version }}
          path: build/Chess-Titans-Remastered-v${{ steps.version.outputs.version }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Windows test build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Version label | \`v${{ steps.version.outputs.version }}\` |"
            echo "| Published | No — this workflow only uploads a temporary Actions artifact |"
            echo "| Package | \`Chess-Titans-Remastered-v${{ steps.version.outputs.version }}-Windows-x64.zip\` |"
          } >> "$GITHUB_STEP_SUMMARY"
